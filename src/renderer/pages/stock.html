<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muhasoft GestPro - Stock</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <script src="../js/utils.js"></script>
  <script>document.write(getSidebarHTML('stock'));</script>
      <div class="main-content">
        <div class="main-header"><h1>Gestao de Stock</h1><div class="header-spacer"></div></div>
        <div class="main-body">
          <div class="toolbar">
            <div class="search-box">
              <input type="text" id="searchInput" placeholder="  Pesquisar artigos...">
            </div>
            <div class="filter-group">
              <label><input type="checkbox" id="filterLow" onchange="loadStock()"> Stock Baixo</label>
            </div>
            <div class="ml-auto">
              <button class="btn btn-primary" onclick="openNewItem()">+ Novo Artigo</button>
            </div>
          </div>
          <div class="card">
            <div class="card-body">
              <div class="table-container">
                <table class="data-table">
                  <thead>
                    <tr><th>Codigo</th><th>Nome</th><th>Categoria</th><th>Marca</th><th>Qtd</th><th>Min</th><th>P. Compra</th><th>P. Venda</th><th>Acoes</th></tr>
                  </thead>
                  <tbody id="stockTable"></tbody>
                </table>
              </div>
              <div id="emptyState" class="empty-state hidden">
                <div class="empty-state-icon">&#x1f4e6;</div><h3>Sem artigos</h3><p>Adicione artigos ao stock</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  <div class="modal-overlay" id="stockModal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h2 id="stockModalTitle">Novo Artigo</h2>
        <button class="modal-close" onclick="hideModal('stockModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="stockForm">
          <input type="hidden" id="stkId">
          <div class="form-row">
            <div class="form-group"><label>Nome *</label><input type="text" id="stkName" class="form-control" required></div>
            <div class="form-group"><label>Categoria</label>
              <select id="stkCategory" class="form-control">
                <option value="">Selecionar</option>
                <option value="1">Armacoes</option>
                <option value="2">Lentes Oftalmicas</option>
                <option value="3">Lentes de Contacto</option>
                <option value="4">Solares</option>
                <option value="5">Acessorios</option>
                <option value="6">Produtos de Limpeza</option>
              </select>
            </div>
          </div>
          <div class="form-row-3">
            <div class="form-group"><label>Marca</label><input type="text" id="stkBrand" class="form-control"></div>
            <div class="form-group"><label>Modelo</label><input type="text" id="stkModel" class="form-control"></div>
            <div class="form-group"><label>Fornecedor</label><input type="text" id="stkSupplier" class="form-control"></div>
          </div>
          <div class="form-group"><label>Descricao</label><textarea id="stkDescription" class="form-control" rows="2"></textarea></div>
          <div class="form-row-4">
            <div class="form-group"><label>Preco Compra</label><input type="number" id="stkPurchasePrice" class="form-control" step="0.01" value="0"></div>
            <div class="form-group"><label>Preco Venda</label><input type="number" id="stkSalePrice" class="form-control" step="0.01" value="0"></div>
            <div class="form-group"><label>Quantidade</label><input type="number" id="stkQuantity" class="form-control" value="0" min="0"></div>
            <div class="form-group"><label>Qtd Minima</label><input type="number" id="stkMinQty" class="form-control" value="5" min="0"></div>
          </div>
          <div class="form-group"><label>Localizacao</label><input type="text" id="stkLocation" class="form-control" placeholder="Ex: Prateleira A3"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="hideModal('stockModal')">Cancelar</button>
        <button class="btn btn-primary" onclick="saveStock()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    (async () => {
      const user = await loadUserInfo();
      if (!user) return;
      setupNavigation('stock');
      await loadStock();
    })();

    document.getElementById('searchInput').addEventListener('input', debounce(() => loadStock(), 300));

    async function loadStock() {
      try {
        const filters = { search: document.getElementById('searchInput').value, active: 1 };
        if (document.getElementById('filterLow').checked) filters.lowStock = true;
        const data = await window.api.getStock(filters);
        renderStock(data);
      } catch (e) { showToast('Erro ao carregar stock', 'error'); }
    }

    function renderStock(data) {
      const tbody = document.getElementById('stockTable');
      const empty = document.getElementById('emptyState');
      if (!data || data.length === 0) { tbody.innerHTML = ''; empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden');
      tbody.innerHTML = data.map(s => `
        <tr class="${s.quantity <= s.min_quantity ? 'text-danger' : ''}">
          <td><strong>${escapeHtml(s.code)}</strong></td>
          <td>${escapeHtml(s.name)}</td>
          <td>${escapeHtml(s.category_name || '-')}</td>
          <td>${escapeHtml(s.brand || '-')}</td>
          <td><strong>${s.quantity}</strong></td>
          <td>${s.min_quantity}</td>
          <td>${formatCurrency(s.purchase_price)}</td>
          <td>${formatCurrency(s.sale_price)}</td>
          <td class="actions">
            <button class="btn btn-sm btn-secondary" onclick="editItem(${s.id})">Editar</button>
            <button class="btn btn-sm btn-danger" onclick="deleteItem(${s.id})">Eliminar</button>
          </td>
        </tr>
      `).join('');
    }

    function openNewItem() {
      document.getElementById('stockModalTitle').textContent = 'Novo Artigo';
      document.getElementById('stockForm').reset();
      document.getElementById('stkId').value = '';
      showModal('stockModal');
    }

    async function editItem(id) {
      const s = await window.api.getStockItem(id);
      if (!s) return;
      document.getElementById('stockModalTitle').textContent = 'Editar Artigo';
      document.getElementById('stkId').value = s.id;
      document.getElementById('stkName').value = s.name;
      document.getElementById('stkCategory').value = s.category_id || '';
      document.getElementById('stkBrand').value = s.brand || '';
      document.getElementById('stkModel').value = s.model || '';
      document.getElementById('stkSupplier').value = s.supplier || '';
      document.getElementById('stkDescription').value = s.description || '';
      document.getElementById('stkPurchasePrice').value = s.purchase_price;
      document.getElementById('stkSalePrice').value = s.sale_price;
      document.getElementById('stkQuantity').value = s.quantity;
      document.getElementById('stkMinQty').value = s.min_quantity;
      document.getElementById('stkLocation').value = s.location || '';
      showModal('stockModal');
    }

    async function saveStock() {
      const id = document.getElementById('stkId').value;
      const data = {
        name: document.getElementById('stkName').value,
        category_id: document.getElementById('stkCategory').value ? parseInt(document.getElementById('stkCategory').value) : null,
        brand: document.getElementById('stkBrand').value || null,
        model: document.getElementById('stkModel').value || null,
        supplier: document.getElementById('stkSupplier').value || null,
        description: document.getElementById('stkDescription').value || null,
        purchase_price: parseFloat(document.getElementById('stkPurchasePrice').value) || 0,
        sale_price: parseFloat(document.getElementById('stkSalePrice').value) || 0,
        quantity: parseInt(document.getElementById('stkQuantity').value) || 0,
        min_quantity: parseInt(document.getElementById('stkMinQty').value) || 5,
        location: document.getElementById('stkLocation').value || null
      };
      if (!data.name) { showToast('Nome e obrigatorio', 'error'); return; }

      let result;
      if (id) { data.id = parseInt(id); result = await window.api.updateStockItem(data); }
      else { result = await window.api.createStockItem(data); }

      if (result.success) { showToast(id ? 'Artigo atualizado' : 'Artigo criado'); hideModal('stockModal'); await loadStock(); }
      else { showToast(result.error, 'error'); }
    }

    async function deleteItem(id) {
      if (!confirm('Desativar este artigo?')) return;
      const result = await window.api.deleteStockItem(id);
      if (result.success) { showToast('Artigo desativado'); await loadStock(); }
      else { showToast(result.error, 'error'); }
    }
  </script>
</body>
</html>
